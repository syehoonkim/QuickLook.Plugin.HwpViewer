<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLook HWP Viewer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #f3f3f3;
        }
    </style>
    <script>
        let width = 0;
        let height = 0;
        window.resizeTo = function (widthInPt, heightInPt) {
            document.documentElement.style.width = widthInPt;
            document.documentElement.style.height = heightInPt;
            width = widthInPt;
            height = heightInPt;
        }
    </script>
</head>
<body>
    <script type="module">
        import init, { HwpDocument } from './rhwp.js';

        globalThis.measureTextWidth = (font, text) => {
            const ctx = document.createElement('canvas').getContext('2d');
            ctx.font = font;
            return ctx.measureText(text).width;
        };

        await init({ module_or_path: '/rhwp_bg.wasm' });

        window.loadHwpFromWebView2 = function (base64Data) {
            try {
                const binaryString = atob(base64Data);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);

                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                const doc = new HwpDocument(bytes);

                const pageCount = doc.pageCount();

                const parser = new DOMParser();
                for (let i = 0; i < pageCount; i++) {
                    const canvas = document.createElement('canvas');
                    const pageInfo = JSON.parse(doc.getPageInfo(i));
                    const pageWidth = pageInfo.width;
                    const pageHeight = pageInfo.height;
                    const r = 0.95;
                    const svg = parser.parseFromString(doc.renderPageSvg(i), "image/svg+xml").documentElement;
                    svg.setAttribute("viewBox", `0 0 ${pageWidth} ${pageHeight}`)
                    svg.setAttribute("width", width * r);
                    svg.setAttribute("height", height * r);
                    document.body.appendChild(svg);
                }

            } catch (error) {
                console.error("문서 렌더링 중 오류 발생:", error);
                document.getElementById('viewer-container').innerHTML =
                    `<p style="color:red; padding:20px;">문서 로드 실패: ${error.message}</p>`;
            }
        };
    </script>
</body>
</html>
