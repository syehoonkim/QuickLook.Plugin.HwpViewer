# .github/workflows/release-with-rhwp.yml
name: Release with updated rhwp

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Existing plugin version tag to build and release only, e.g. 0.1.2"
        required: false
        type: string
  schedule:
    - cron: "0 18 * * *" # 매일 KST 03:00, UTC 기준

permissions:
  contents: write

concurrency:
  group: release-with-rhwp
  cancel-in-progress: false

jobs:
  update-rhwp:
    name: Check rhwp update and create plugin version tag
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      plugin_version: ${{ steps.version.outputs.plugin_version }}
      rhwp_tag: ${{ steps.rhwp_check.outputs.rhwp_tag }}
      rhwp_rev: ${{ steps.rhwp_check.outputs.latest_rev }}

    steps:
      - name: Manual release mode
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        shell: bash
        run: |
          echo "Manual release mode for existing tag: ${{ inputs.release_version }}"
          echo "Skipping rhwp update detection and mutation steps."

      - name: Checkout repository with submodules and tags
        if: github.event_name != 'workflow_dispatch' || inputs.release_version == ''
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        if: github.event_name != 'workflow_dispatch' || inputs.release_version == ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check latest rhwp tag against current submodule
        id: rhwp_check
        if: github.event_name != 'workflow_dispatch' || inputs.release_version == ''
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_REV="$(git -C external/rhwp rev-parse HEAD)"

          git -C external/rhwp fetch --tags origin

          RHWP_TAG="$(git -C external/rhwp tag --sort=-v:refname | head -n 1)"

          if [ -z "$RHWP_TAG" ]; then
            echo "No rhwp tag found."
            exit 1
          fi

          LATEST_REV="$(git -C external/rhwp rev-list -n 1 "$RHWP_TAG")"

          echo "current_rev=$CURRENT_REV" >> "$GITHUB_OUTPUT"
          echo "rhwp_tag=$RHWP_TAG" >> "$GITHUB_OUTPUT"
          echo "latest_rev=$LATEST_REV" >> "$GITHUB_OUTPUT"

          echo "Current rhwp revision: $CURRENT_REV"
          echo "Latest rhwp tag: $RHWP_TAG"
          echo "Latest rhwp revision: $LATEST_REV"

          if [ "$CURRENT_REV" = "$LATEST_REV" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "rhwp is already up to date."
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "new rhwp revision detected."
          fi

      - name: Update rhwp submodule to latest tag
        if: steps.rhwp_check.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git -C external/rhwp checkout "${{ steps.rhwp_check.outputs.rhwp_tag }}"
          echo "${{ steps.rhwp_check.outputs.latest_rev }}" > RHWP_REVISION

      - name: Build rhwp WASM with Docker
        if: steps.rhwp_check.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cd external/rhwp

          printf "UID=%s\nGID=%s\n" "$(id -u)" "$(id -g)" > .env.docker

          echo "Using Docker build user:"
          cat .env.docker

          docker compose --env-file .env.docker run --rm wasm

      - name: Verify rhwp WASM artifacts
        if: steps.rhwp_check.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -s external/rhwp/pkg/rhwp.js
          test -s external/rhwp/pkg/rhwp_bg.wasm

      - name: Copy rhwp artifacts to plugin root
        if: steps.rhwp_check.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cp external/rhwp/pkg/rhwp.js ./rhwp.js
          cp external/rhwp/pkg/rhwp_bg.wasm ./rhwp_bg.wasm

      - name: Check whether rhwp update changed repository
        id: changes
        if: steps.rhwp_check.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- external/rhwp rhwp.js rhwp_bg.wasm RHWP_REVISION; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No rhwp-related changes after build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "rhwp-related changes detected."
          fi

      - name: Calculate next plugin patch version
        id: version
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          LAST_TAG="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [ -z "$LAST_TAG" ]; then
            NEXT_TAG="0.0.1"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_TAG"

            if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
              echo "Invalid latest plugin version tag: $LAST_TAG"
              exit 1
            fi

            PATCH=$((PATCH + 1))
            NEXT_TAG="${MAJOR}.${MINOR}.${PATCH}"
          fi

          if git rev-parse "$NEXT_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $NEXT_TAG"
            exit 1
          fi

          echo "plugin_version=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "Next plugin version: $NEXT_TAG"

      - name: Commit rhwp update and create plugin version tag
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git add external/rhwp rhwp.js rhwp_bg.wasm RHWP_REVISION

          git commit -m "Update rhwp to ${{ steps.rhwp_check.outputs.rhwp_tag }}"

          git tag "${{ steps.version.outputs.plugin_version }}"

          git push origin HEAD
          git push origin "${{ steps.version.outputs.plugin_version }}"

  build-and-release:
    name: Build plugin, pack qlplugin, and create release
    needs: update-rhwp
    if: needs.update-rhwp.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    runs-on: windows-latest

    steps:
      - name: Resolve release version
        id: release_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.release_version }}" -ne "") {
            $version = "${{ inputs.release_version }}"
          }
          else {
            $version = "${{ needs.update-rhwp.outputs.plugin_version }}"
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Release version could not be resolved."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release version: $version"

      - name: Checkout plugin version tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release_version.outputs.version }}
          submodules: recursive
          fetch-depth: 0

      - name: Read bundled rhwp metadata
        id: bundled_rhwp
        shell: pwsh
        run: |
          if (Test-Path "./RHWP_REVISION") {
            $rev = (Get-Content "./RHWP_REVISION" -Raw).Trim()
          }
          else {
            $rev = (git -C external/rhwp rev-parse HEAD).Trim()
          }

          $tag = git -C external/rhwp describe --tags --exact-match 2>$null
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "unknown"
          }

          "rhwp_rev=$rev" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "rhwp_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "Bundled rhwp tag: $tag"
          Write-Host "Bundled rhwp revision: $rev"

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore QuickLook.Plugin.HwpViewer.sln

      - name: Generate version files from git tag
        shell: pwsh
        run: |
          ./Scripts/update-version.ps1

      - name: Build Release
        shell: pwsh
        run: |
          msbuild QuickLook.Plugin.HwpViewer.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Pack qlplugin
        shell: pwsh
        working-directory: ./Scripts
        run: |
          ./pack-zip.ps1

      - name: Verify package
        shell: pwsh
        run: |
          if (!(Test-Path "./QuickLook.Plugin.HwpViewer.qlplugin")) {
            throw "QuickLook.Plugin.HwpViewer.qlplugin was not created."
          }

          $size = (Get-Item "./QuickLook.Plugin.HwpViewer.qlplugin").Length

          if ($size -le 0) {
            throw "QuickLook.Plugin.HwpViewer.qlplugin is empty."
          }

          Write-Host "Package size: $size bytes"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
          RHWP_TAG: ${{ steps.bundled_rhwp.outputs.rhwp_tag }}
          RHWP_REV: ${{ steps.bundled_rhwp.outputs.rhwp_rev }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$RELEASE_VERSION" \
            "QuickLook.Plugin.HwpViewer.qlplugin" \
            --title "QuickLook.Plugin.HwpViewer $RELEASE_VERSION" \
            --notes "Bundled rhwp tag: $RHWP_TAG
          Bundled rhwp revision: $RHWP_REV"
